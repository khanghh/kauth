<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - MineViet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .avatar-initial {
      font-size: 0;
      height: 32px;
      text-transform: uppercase;
    }

    .avatar-initial:first-letter {
      font-size: 24px;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 antialiased">
  <div class="w-full max-w-md sm:max-w-lg bg-white shadow-lg rounded-2xl overflow-hidden">
    <!-- Header with "Edit Profile" text on top -->
    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white px-8 py-6">
      <div class="flex items-center">
        <a href="/profile" class="flex items-center text-white hover:text-gray-200">
          <i class="fas fa-arrow-left mr-3"></i>
        </a>
        <h1 class="text-2xl font-bold">Edit Profile</h1>
      </div>
      <p class="text-indigo-100 mt-2">Update your personal information</p>
    </div>

    <div class="p-8">
      <!-- Photo Edit Section -->
      <div class="text-center mb-8">
        <div class="relative w-32 h-32 mx-auto mb-4">
          <div
            class="w-full h-full rounded-full border-4 border-blue-100 overflow-hidden flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
            <img
              src="https://lh3.googleusercontent.com/a/ACg8ocJ3AGOwBK1bdrsn2LDW8lFbNk6tjGnK9d6qk_GUaN2Nzw47Y7qt=s96-c"
              alt="Profile" class="w-full h-full object-cover" onerror="this.style.display='none';">
            <span class="avatar-initial text-white text-4xl font-bold">M</span>
          </div>
          <button type="button"
            class="absolute bottom-0 right-0 w-10 h-10 bg-white text-blue-600 rounded-full border-2 border-blue-600 flex items-center justify-center hover:bg-blue-50">
            <i class="fas fa-camera"></i>
          </button>
        </div>

        <h2 class="text-xl font-bold text-gray-800">MineViet Official</h2>
        <p class="text-gray-600 mt-1">
          <span class="font-medium text-blue-600">@mineviet_official</span>
        </p>
        <p class="text-gray-500 text-sm mt-1">
          minevietofficial@gmail.com
        </p>
      </div>

      <form class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Display Name
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-user text-gray-400"></i>
            </div>
            <input type="text" value="MineViet Official"
              class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Username
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-at text-gray-400"></i>
            </div>
            <div class="flex items-center">
              <span class="pl-10 pr-4 py-3 border border-gray-200 rounded-l-xl bg-gray-50 w-full">
                @mineviet_official
              </span>
              <button type="button"
                class="px-4 py-3 border border-gray-200 border-l-0 rounded-r-xl bg-blue-50 text-blue-600 hover:bg-blue-100">
                Change
              </button>
            </div>
          </div>
          <p class="text-xs text-gray-500 mt-2">Your unique username on MineViet</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-envelope text-gray-400"></i>
            </div>
            <input type="email" value="minevietofficial@gmail.com"
              class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm bg-gray-50"
              readonly>
          </div>
          <p class="text-xs text-gray-500 mt-2">Email address cannot be changed</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Phone Number
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-phone text-gray-400"></i>
            </div>
            <input type="tel" value="+84 123 456 789"
              class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm">
          </div>
          <p class="text-xs text-gray-500 mt-2">Your contact phone number</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Birthday
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-birthday-cake text-gray-400"></i>
            </div>
            <input type="date" value="1990-01-15"
              class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm">
          </div>
          <p class="text-xs text-gray-500 mt-2">Your date of birth (YYYY-MM-DD)</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Country/Region
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-globe text-gray-400"></i>
            </div>
            <select
              class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm appearance-none bg-white">
              <option>Vietnam</option>
              <option>United States</option>
              <option>United Kingdom</option>
              <option>Canada</option>
              <option>Australia</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
              <i class="fas fa-chevron-down text-gray-400"></i>
            </div>
          </div>
        </div>

        <div class="pt-6">
          <div class="flex items-center justify-between">
            <a href="/profile"
              class="flex items-center px-4 py-3 border border-gray-200 rounded-xl text-gray-700 shadow-sm hover:text-blue-600 hover:bg-sky-50 hover:border-blue-300">
              <i class="fas fa-times mr-2"></i>
              Cancel
            </a>
            <button type="submit"
              class="flex items-center px-6 py-3 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-xl shadow-sm hover:opacity-90">
              <i class="fas fa-save mr-2"></i>
              Save Changes
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="bg-gray-50 px-8 py-4 text-center">
      <form action="/logout" method="POST">
        <input type="hidden" name="_csrf" value="token">
        <button class="text-red-600 hover:text-red-500 text-sm font-medium" type="submit">
          Log out &gt;&gt;
        </button>
      </form>
    </div>
  </div>
</body>

</html>
